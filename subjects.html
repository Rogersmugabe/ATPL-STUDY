<!DOCTYPE html>
<html>

<head>

<title>ATPL Study</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="container">

<h1>ATPL STUDY</h1>

<h2>Select Subject</h2>


<button onclick="selectSubject('AirLaw','Air Law')">
Air Law
</button>


<button onclick="selectSubject('Meteorology','Meteorology')">
Meteorology
</button>

<button onclick="selectSubject('Operational','Operational Procedures')">

</button>

</div>


<script>

function selectSubject(file,name){

localStorage.setItem("subjectFile",file);

localStorage.setItem("subjectName",name);

window.location.href="index.html";

}

</script>


</body>

</html>
